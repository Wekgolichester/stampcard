<title>우표 콜라주 스튜디오</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&display=swap">
<style>
  :root{
    --bg:#FFFFFF; --stage:#F0F1F3; --panel:#FFFFFF; --panel-2:#F7F7F8;
    --ink:#18181B; --muted:#71717A; --faint:#A1A1AA; --line:#E7E7EA;
    --accent:#18181B; --accent-soft:#F1F1F2;
    --radius:12px;
    --ui:"Archivo",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  }
  html,body{height:100%;}
  *{box-sizing:border-box;}
  body{background:var(--bg);color:var(--ink);font-family:var(--ui);line-height:1.45;
    -webkit-font-smoothing:antialiased;}

  /* 넓은 화면: 두 컬럼이 뷰포트 높이에 딱 맞음 → 미리보기 완벽 중앙 정렬 */
  .app{display:flex;height:100%;}
  @media (max-width:880px){ html,body{height:auto;} .app{flex-direction:column;height:auto;} }

  /* ---------- STAGE (left) ---------- */
  .stage{flex:1 1 auto;min-width:0;height:100%;background:var(--stage);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:28px;overflow:hidden;}
  @media (max-width:880px){ .stage{height:auto;padding:22px 16px;min-height:70svh;} }
  .canvas-shell{line-height:0;align-self:center;max-width:100%;margin:0 auto;
    filter:drop-shadow(0 10px 34px rgba(24,24,27,.18));}
  canvas#c{max-width:100%;max-height:82vh;width:auto;height:auto;border-radius:2px;
    cursor:grab;touch-action:none;background:#fff;display:block;}
  @media (max-width:880px){ canvas#c{max-height:60vh;} }
  canvas#c:active{cursor:grabbing;}
  .stage-hint{position:absolute;left:0;right:0;bottom:16px;text-align:center;color:var(--faint);
    font-size:12px;padding:0 20px;pointer-events:none;}
  .saved{position:absolute;left:20px;bottom:20px;display:flex;gap:10px;align-items:center;
    background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;
    box-shadow:0 6px 24px rgba(24,24,27,.12);max-width:260px;}
  .saved img{width:42px;height:auto;border-radius:5px;border:1px solid var(--line);}
  .saved p{margin:0;font-size:11.5px;color:var(--muted);line-height:1.4;}
  .saved strong{color:var(--ink);font-weight:600;}
  .saved .x{margin-left:auto;border:0;background:none;color:var(--faint);cursor:pointer;font-size:16px;line-height:1;padding:2px;}

  /* ---------- PANEL (right) ---------- */
  .panel{flex:0 0 366px;width:366px;height:100%;overflow-y:auto;background:var(--panel);border-left:1px solid var(--line);}
  @media (max-width:880px){ .panel{flex:1 1 auto;width:100%;height:auto;overflow:visible;border-left:0;border-top:1px solid var(--line);} }
  .panel-inner{padding:8px 22px 30px;}

  .brand{padding:20px 0 14px;border-bottom:1px solid var(--line);margin-bottom:6px;}
  .brand .name{font-size:16px;font-weight:700;letter-spacing:-.01em;}
  .brand .sub{font-size:12px;color:var(--muted);margin-top:2px;}

  .sec{padding:18px 0;border-bottom:1px solid var(--line);}
  .sec:last-of-type{border-bottom:0;}
  .sec > h2{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--faint);
    font-weight:700;margin:0 0 14px;}

  .row{display:flex;flex-direction:column;gap:8px;margin-bottom:16px;}
  .row:last-child{margin-bottom:0;}
  .row .lab{display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:500;}
  .row .val{color:var(--muted);font-variant-numeric:tabular-nums;font-size:12.5px;font-weight:500;}

  /* file drop + item */
  .drop{display:block;width:100%;border:0;border-radius:11px;padding:18px 14px;
    text-align:center;cursor:pointer;transition:background .15s;background:var(--panel-2);}
  .drop:hover,.drop.over{background:#E0E0E4;}
  .drop strong{font-weight:600;font-size:13.5px;}
  .drop small{display:block;color:var(--muted);font-size:11.5px;margin-top:4px;}
  input[type=file]{display:none;}
  .fileitem{display:flex;align-items:center;gap:11px;background:var(--panel-2);border:1px solid var(--line);
    border-radius:11px;padding:10px 12px;}
  .fileitem img{width:34px;height:44px;object-fit:cover;border-radius:4px;border:1px solid var(--line);background:#fff;}
  .fileitem .meta{min-width:0;flex:1;}
  .fileitem .t{font-size:13px;font-weight:600;}
  .fileitem .n{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .fileitem .x{border:0;background:none;color:var(--faint);cursor:pointer;font-size:18px;line-height:1;padding:4px;}
  .fileitem .x:hover{color:var(--ink);}

  /* segmented */
  .seg{display:flex;gap:6px;background:var(--panel-2);border:1px solid var(--line);
    border-radius:10px;padding:4px;}
  .seg button{flex:1;border:0;background:transparent;color:var(--muted);font-family:var(--ui);
    font-size:12.5px;font-weight:600;padding:9px 6px;border-radius:7px;cursor:pointer;line-height:1.2;}
  .seg button .d{display:block;font-weight:400;font-size:10.5px;color:var(--faint);margin-top:1px;
    font-variant-numeric:tabular-nums;}
  .seg button[aria-pressed=true]{background:var(--panel);color:var(--ink);
    box-shadow:0 1px 2px rgba(0,0,0,.1);}
  .seg button[aria-pressed=true] .d{color:var(--muted);}

  /* swatches */
  .sw{display:flex;flex-wrap:wrap;gap:9px;align-items:center;}
  .sw button{width:29px;height:29px;border-radius:50%;border:1px solid rgba(0,0,0,.12);cursor:pointer;
    padding:0;position:relative;transition:transform .1s;}
  .sw button:hover{transform:scale(1.08);}
  .sw button[aria-pressed=true]{box-shadow:0 0 0 2px var(--panel),0 0 0 3.5px var(--ink);}
  .sw .custom{overflow:hidden;display:inline-flex;background:conic-gradient(from 0deg,#f66,#fd6,#6f8,#6cf,#a6f,#f6c,#f66);}
  .sw .custom input{opacity:0;width:100%;height:100%;cursor:pointer;border:0;padding:0;}

  input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:4px;border-radius:4px;
    background:var(--line);outline:none;margin:2px 0;}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:17px;height:17px;border-radius:50%;
    background:var(--ink);cursor:pointer;border:2px solid var(--panel);box-shadow:0 1px 3px rgba(0,0,0,.25);}
  input[type=range]::-moz-range-thumb{width:17px;height:17px;border-radius:50%;background:var(--ink);
    cursor:pointer;border:2px solid var(--panel);}

  .btn{width:100%;border:0;border-radius:11px;padding:13px;font-family:var(--ui);font-size:13.5px;
    font-weight:700;cursor:pointer;background:var(--accent);color:#fff;
    display:flex;align-items:center;justify-content:center;gap:8px;transition:opacity .12s;}
  .btn:hover{opacity:.88;}
  .btn svg{width:16px;height:16px;}
  .btn.ghost{background:var(--panel);color:var(--ink);border:1px solid var(--line);font-weight:600;}
  .btn.ghost:hover{background:var(--panel-2);opacity:1;}
  .btn-row{display:flex;gap:9px;}
  .foot{color:var(--faint);font-size:11px;text-align:center;margin-top:12px;line-height:1.5;}
</style>

<div class="app">
  <!-- LEFT: preview -->
  <section class="stage" aria-label="미리보기">
    <div class="canvas-shell">
      <canvas id="c" width="1080" height="1920" role="img" aria-label="우표 콜라주 미리보기"></canvas>
    </div>
    <p class="stage-hint">사진·우표를 끌어서 이동</p>
    <div class="saved" id="saved" hidden>
      <img id="savedImg" alt="저장 이미지">
      <p><strong>이미지 준비됨</strong><br>모바일은 꾹 눌러 저장</p>
      <button class="x" id="savedX" aria-label="닫기">×</button>
    </div>
  </section>

  <!-- RIGHT: controls -->
  <aside class="panel">
    <div class="panel-inner">
      <div class="brand">
        <div class="name">우표 콜라주</div>
      </div>

      <div class="sec">
        <h2>이미지</h2>
        <label class="drop" id="drop" for="file">
          <strong>사진 올리기</strong>
          <small>클릭하거나 여기로 끌어다 놓기</small>
        </label>
        <input type="file" id="file" accept="image/*,.heic,.heif">
        <div id="fileitem" class="fileitem" hidden style="margin-top:10px;">
          <img id="fileThumb" alt="">
          <div class="meta"><div class="t">내 사진</div><div class="n" id="fileName">—</div></div>
          <button class="x" id="fileRemove" aria-label="사진 제거">×</button>
        </div>
      </div>

      <div class="sec">
        <h2>캔버스 사이즈</h2>
        <div class="seg" role="group" aria-label="사이즈">
          <button id="sizeStory" aria-pressed="true">스토리<span class="d">1080 × 1920</span></button>
          <button id="sizeFeed" aria-pressed="false">피드<span class="d">1080 × 1350</span></button>
        </div>
      </div>

      <div class="sec">
        <h2>배경색</h2>
        <div class="sw" id="swatches"></div>
      </div>

      <div class="sec">
        <h2>우표 · 그림자</h2>
        <div class="row">
          <div class="lab"><span>우표 크기</span><span class="val" id="stampVal">100%</span></div>
          <input type="range" id="stampScale" min="55" max="165" value="100">
        </div>
        <div class="row">
          <div class="lab"><span>그림자 세기</span><span class="val" id="shadowVal">55</span></div>
          <input type="range" id="shadow" min="0" max="100" value="55">
        </div>
        <div class="row" style="margin-bottom:0;">
          <div class="lab"><span>메인 사진 확대</span><span class="val" id="mainZVal">1.0×</span></div>
          <input type="range" id="mainZoom" min="100" max="320" value="100">
        </div>
      </div>

      <div class="sec">
        <div class="btn-row">
          <button class="btn ghost" id="resetBtn" style="flex:0 0 42%;">초기화</button>
          <button class="btn" id="saveBtn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>
            이미지 저장 · PNG
          </button>
        </div>
      </div>
    </div>
  </aside>
</div>

const SW=166, SH=146;
const SIZES={ story:{w:1080,h:1920}, feed:{w:1080,h:1350} };

const state={
  size:'story', bg:'#FFFFFF', split:0.5, stampScale:1, shadow:55,
  main:{zoom:1,panX:0,panY:0},
  top:{cx:0.5, cy:0.25},
  bot:{cx:0.5, cy:0.75},
  img:null, isPlaceholder:true
};
const TOP_BASE_W=0.336, BOT_BASE_W=0.336;
// 위/아래 반쪽을 각각의 캔버스로 보고, 같은 상대 위치로 나란히(평행) 이동
function linkStamps(from){
  if(from==='bot'){ state.top.cx=state.bot.cx; state.top.cy=state.bot.cy-0.5; }
  else{ state.bot.cx=state.top.cx; state.bot.cy=state.top.cy+0.5; }
}

const cv=document.getElementById('c'), ctx=cv.getContext('2d');
const $=id=>document.getElementById(id);

/* placeholder */
function makePlaceholder(cb){
  const p=document.createElement('canvas'); p.width=900; p.height=1200;
  const g=p.getContext('2d');
  const grad=g.createLinearGradient(0,0,900,1200);
  grad.addColorStop(0,'#8FB8AD'); grad.addColorStop(.5,'#CDBBD8'); grad.addColorStop(1,'#EDC49B');
  g.fillStyle=grad; g.fillRect(0,0,900,1200);
  g.globalAlpha=.16; g.fillStyle='#fff';
  for(let i=0;i<5;i++){ g.beginPath(); g.arc(180+i*150, 300+((i*220)%700), 120-i*8, 0, 7); g.fill(); }
  g.globalAlpha=1; g.fillStyle='rgba(255,255,255,.94)';
  g.textAlign='center'; g.font='600 62px "Archivo",sans-serif';
  g.fillText('SAMPLE', 450, 585);
  g.font='400 32px "Archivo",sans-serif';
  g.fillText('사진을 올려보세요', 450, 645);
  const im=new Image(); im.onload=()=>cb(im); im.src=p.toDataURL();
}

/* main photo placement in bottom panel -> {dx,dy,s} */
function mainTransform(){
  const {w,h}=SIZES[state.size]; const splitY=Math.round(h*state.split);
  const img=state.img, iw=img.naturalWidth, ih=img.naturalHeight, rh=h-splitY;
  const s=Math.max(w/iw, rh/ih)*state.main.zoom;
  const dw=iw*s, dh=ih*s;
  const dx=(w-dw)/2 + state.main.panX;
  const dy=splitY + (rh-dh)/2 + state.main.panY;
  return {dx,dy,s,splitY,w,h};
}

/* build stamp Path2D in canvas coords */
function stampPath(cx,cy,wPx){
  const scale=wPx/SW, hPx=SH*scale, left=cx-wPx/2, top=cy-hPx/2;
  const m=new DOMMatrix().translateSelf(left,top).scaleSelf(scale);
  const p=new Path2D(); p.addPath(new Path2D(STAMP_PATH), m);
  return p;
}
function applyShadow(){
  if(state.shadow<=0){ ctx.shadowColor='transparent'; return; }
  const t=state.shadow/100;
  // 세기 올릴수록: 블러는 아주 조금만 / x·y 거리 길어짐 / 불투명도 높아짐
  ctx.shadowColor='rgba(24,26,24,'+(0.14+t*0.42)+')';
  ctx.shadowBlur=3+t*7;
  ctx.shadowOffsetX=t*10;
  ctx.shadowOffsetY=2+t*30;
}

// 우표 안쪽으로 파고드는 내부 그림자 (바깥 영역을 그림자와 함께 채워 안으로 번지게)
function drawInnerShadow(path){
  if(state.shadow<=0) return;
  const {w,h}=SIZES[state.size];
  const t=state.shadow/100;
  ctx.save();
  ctx.clip(path);
  const region=new Path2D();
  region.rect(-w, -h, w*3, h*3);
  region.addPath(path);
  ctx.shadowColor='rgba(24,26,24,'+(0.2+t*0.5)+')';
  ctx.shadowBlur=3+t*7;
  ctx.shadowOffsetX=0;
  ctx.shadowOffsetY=1+t*4;
  ctx.fillStyle='#000';
  ctx.fill(region,'evenodd');
  ctx.restore();
}

function render(){
  const {w,h}=SIZES[state.size];
  if(cv.width!==w||cv.height!==h){ cv.width=w; cv.height=h; }
  const splitY=Math.round(h*state.split);
  const img=state.img;

  ctx.clearRect(0,0,w,h);
  ctx.fillStyle=state.bg; ctx.fillRect(0,0,w,h);

  const mt = img ? mainTransform() : null;

  // main photo, bottom panel
  if(mt){
    ctx.save();
    ctx.beginPath(); ctx.rect(0,splitY,w,h-splitY); ctx.clip();
    ctx.drawImage(img, mt.dx, mt.dy, img.naturalWidth*mt.s, img.naturalHeight*mt.s);
    ctx.restore();
  }

  // stamp geometry
  const botCx=state.bot.cx*w, botCy=state.bot.cy*h, botW=BOT_BASE_W*w*state.stampScale;
  const topCx=state.top.cx*w, topCy=state.top.cy*h, topW=TOP_BASE_W*w*state.stampScale;

  // bottom "removed" stamp = background colour, with an INNER shadow (사진이 뚫린 듯 안쪽으로)
  const bp=stampPath(botCx,botCy,botW);
  ctx.save(); ctx.fillStyle=state.bg; ctx.fill(bp); ctx.restore();
  drawInnerShadow(bp);

  // top stamp = the exact piece the bottom stamp is covering (synced)
  const tp=stampPath(topCx,topCy,topW);
  ctx.save(); applyShadow(); ctx.fillStyle='#ffffff'; ctx.fill(tp); ctx.restore();
  if(mt){
    const imx=(botCx-mt.dx)/mt.s, imy=(botCy-mt.dy)/mt.s;   // image point under bottom-stamp centre
    const s2=mt.s*(topW/botW);
    const dx2=topCx-imx*s2, dy2=topCy-imy*s2;
    ctx.save(); ctx.clip(tp);
    ctx.drawImage(img, dx2, dy2, img.naturalWidth*s2, img.naturalHeight*s2);
    ctx.restore();
  }
}

/* hit test / drag */
function stampRect(which){
  const {w,h}=SIZES[state.size];
  const s=which==='top'?state.top:state.bot;
  const wPx=(which==='top'?TOP_BASE_W:BOT_BASE_W)*w*state.stampScale;
  const hPx=SH*(wPx/SW);
  return {x:s.cx*w-wPx/2, y:s.cy*h-hPx/2, w:wPx, h:hPx};
}
function toCanvas(e){
  const r=cv.getBoundingClientRect();
  return { x:(e.clientX-r.left)*(cv.width/r.width), y:(e.clientY-r.top)*(cv.height/r.height) };
}
let drag=null;
cv.addEventListener('pointerdown',e=>{
  const p=toCanvas(e); const {w,h}=SIZES[state.size];
  const inside=rc=>p.x>=rc.x&&p.x<=rc.x+rc.w&&p.y>=rc.y&&p.y<=rc.y+rc.h;
  const rt=stampRect('top'), rb=stampRect('bot');
  if(inside(rb)) drag={t:'bot', ox:p.x-state.bot.cx*w, oy:p.y-state.bot.cy*h};
  else if(inside(rt)) drag={t:'top', ox:p.x-state.top.cx*w, oy:p.y-state.top.cy*h};
  else if(p.y>=h*state.split && state.img) drag={t:'main', ox:p.x, oy:p.y, px:state.main.panX, py:state.main.panY};
  if(drag) cv.setPointerCapture(e.pointerId);
});
cv.addEventListener('pointermove',e=>{
  if(!drag) return;
  const p=toCanvas(e); const {w,h}=SIZES[state.size];
  if(drag.t==='main'){ state.main.panX=drag.px+(p.x-drag.ox); state.main.panY=drag.py+(p.y-drag.oy); }
  else{ const s=drag.t==='top'?state.top:state.bot;
        s.cx=Math.min(1.12,Math.max(-0.12,(p.x-drag.ox)/w));
        s.cy=Math.min(1.12,Math.max(-0.12,(p.y-drag.oy)/h)); }
  render();
});
cv.addEventListener('pointerup',()=>{ drag=null; });
cv.addEventListener('wheel',e=>{
  if(!state.img) return; e.preventDefault();
  let z=Math.min(3.2,Math.max(1, state.main.zoom*(e.deltaY<0?1.06:0.94)));
  state.main.zoom=z; $('mainZoom').value=Math.round(z*100); $('mainZVal').textContent=z.toFixed(1)+'×';
  render();
},{passive:false});

/* controls */
function setSize(sz){
  state.size=sz;
  $('sizeStory').setAttribute('aria-pressed', sz==='story');
  $('sizeFeed').setAttribute('aria-pressed', sz==='feed');
  render();
}
$('sizeStory').onclick=()=>setSize('story');
$('sizeFeed').onclick=()=>setSize('feed');
$('stampScale').oninput=e=>{ state.stampScale=+e.target.value/100; $('stampVal').textContent=e.target.value+'%'; render(); };
$('shadow').oninput=e=>{ state.shadow=+e.target.value; $('shadowVal').textContent=e.target.value; render(); };
$('mainZoom').oninput=e=>{ state.main.zoom=+e.target.value/100; $('mainZVal').textContent=(+e.target.value/100).toFixed(1)+'×'; render(); };
$('resetBtn').onclick=()=>{
  state.main={zoom:1,panX:0,panY:0};
  state.top={cx:0.5,cy:0.25}; state.bot={cx:0.5,cy:0.75};
  state.stampScale=1; state.shadow=55;
  $('mainZoom').value=100; $('mainZVal').textContent='1.0×';
  $('stampScale').value=100; $('stampVal').textContent='100%';
  $('shadow').value=55; $('shadowVal').textContent='55';
  render();
};

/* swatches */
const SWATCHES=['#FFFFFF','#F4EFE6','#F3D9DE','#E7DDF0','#CDDCC9','#CBDDEA','#F2E7C4','#1C1C1C'];
const swWrap=$('swatches');
SWATCHES.forEach(col=>{

const cust=document.createElement('button');
cust.className='custom'; cust.title='직접 선택';
cust.innerHTML='<input type="color" value="#ffffff" aria-label="배경색 직접 선택">';

swWrap.appendChild(cust);

/* upload */
const fileInput=$('file'), drop=$('drop');
const dropStrong=()=>drop.querySelector('strong');
function applyImage(im, url, name){
  state.img=im; state.isPlaceholder=false;
  state.main={zoom:1,panX:0,panY:0}; $('mainZoom').value=100; $('mainZVal').textContent='1.0×';
  $('fileThumb').src=url; $('fileName').textContent=name||'image';
  $('fileitem').hidden=false; dropStrong().textContent='다른 사진으로 교체';
  render();
}
function tryDecode(blob, name){ // 브라우저 네이티브 디코드 시도
  return new Promise((res,rej)=>{
    const url=URL.createObjectURL(blob);
    const im=new Image();
    im.onload=()=>res({im,url,name});
    im.onerror=()=>{ URL.revokeObjectURL(url); rej(new Error('native-decode-failed')); };
    im.src=url;
  });
}
function getHeif(){
  return new Promise((resolve,reject)=>{
    let tries=0;
    (function poll(){
      let L=window.libheif;
      if(typeof L==='function'){ try{ const r=L(); if(r&&r.HeifDecoder) L=r; }catch(e){} }
      if(L && L.HeifDecoder) return resolve(L);
      if(++tries>120) return reject(new Error('libheif 로딩 실패'));
      setTimeout(poll,100);
    })();
  });
}
async function convertHeic(f){
  const name=(f.name||'image').replace(/\.(heic|heif)$/i,'.jpg');
  dropStrong().textContent='HEIC 변환 중…';
  try{
    const heif=await getHeif();
    const buf=new Uint8Array(await f.arrayBuffer());
    const imgs=new heif.HeifDecoder().decode(buf);
    if(!imgs||!imgs.length) throw new Error('이미지 없음');
    const image=imgs[0], w=image.get_width(), h=image.get_height();
    const cvs=document.createElement('canvas'); cvs.width=w; cvs.height=h;
    const c2=cvs.getContext('2d'), id=c2.createImageData(w,h);
    await new Promise((res,rej)=>{ image.display(id, d=>{ d?res():rej(new Error('디코딩 실패')); }); });
    c2.putImageData(id,0,0);
    const url=cvs.toDataURL('image/jpeg',0.92);
    const im=new Image();
    im.onload=()=>applyImage(im,url,name);
    im.onerror=()=>{ dropStrong().textContent='HEIC 표시 실패'; };
    im.src=url;
  }catch(e){ console.error('HEIC error:',e);
    dropStrong().textContent='HEIC 열기 실패: '+((e&&e.message)||e).toString().slice(0,40); }
}
function loadFile(f){
  if(!f) return;
  const isHeic=/image\/hei[cf]/i.test(f.type)||/\.(heic|heif)$/i.test(f.name||'');
  if(!isHeic && !f.type.startsWith('image/')) return;
  tryDecode(f, f.name)                         // 먼저 네이티브로 시도 (사파리는 HEIC도 됨)
    .then(({im,url,name})=>applyImage(im,url,name))
    .catch(()=>{ if(isHeic) convertHeic(f);     // 실패 & HEIC → 변환
                 else dropStrong().textContent='이미지를 열 수 없음'; });
}
fileInput.onchange=e=>loadFile(e.target.files[0]);
$('fileRemove').onclick=()=>{
  $('fileitem').hidden=true; fileInput.value=''; drop.querySelector('strong').textContent='사진 올리기';
  makePlaceholder(im=>{ state.img=im; state.isPlaceholder=true; render(); });
};
['dragenter','dragover'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.add('over');}));
['dragleave','drop'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.remove('over');}));
drop.addEventListener('drop',e=>loadFile(e.dataTransfer.files[0]));
cv.addEventListener('dragover',e=>e.preventDefault());
cv.addEventListener('drop',e=>{e.preventDefault(); loadFile(e.dataTransfer.files[0]);});

/* save */
$('savedX').onclick=()=>$('saved').hidden=true;
$('saveBtn').onclick=()=>{
  render();
  cv.toBlob(async blob=>{
    if(!blob) return;
    try{
      const dl = window.claude && claude.use ? await claude.use('downloads') : null;
      if(dl) await dl.save({filename:`stamp_${state.size}_${Date.now()}.png`, data:blob});
    }catch(err){}
    const url=URL.createObjectURL(blob);
    $('savedImg').src=url; $('saved').hidden=false;
  },'image/png');
};

/* boot */
makePlaceholder(im=>{ state.img=im; state.isPlaceholder=true; render(); });
render();
</script>
